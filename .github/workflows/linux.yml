name: Lanzador Linux

# Construye la app para Linux, la prueba (bajar Chromium y abrirlo) y la publica
# como release "lanzador-v1". Se lanza a mano desde la pestaña Actions o con
# un tag lanzador-v*.
on:
  workflow_dispatch:
  push:
    tags: ["lanzador-v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          pip install playwright pyinstaller pillow certifi
          python -c "import tkinter; print('tk', tkinter.TkVersion)"

      - name: Construir
        run: |
          python lanzador/hacer_icono.py
          # Módulos extra para que las actualizaciones del código puedan usarlos sin reinstalar
          # (la misma lista está en herramientas/construir_windows.py).
          EXTRA="--collect-submodules tkinter --collect-submodules email --collect-submodules http \
            --collect-submodules urllib --collect-submodules json --collect-submodules html \
            --collect-submodules xml --collect-submodules concurrent"
          for m in csv uuid zoneinfo statistics dataclasses base64 hashlib secrets shlex textwrap difflib \
                   calendar locale platform webbrowser queue socket ssl; do EXTRA="$EXTRA --hidden-import $m"; done
          pyinstaller --noconfirm --clean --windowed --name vigilante-mec \
            --add-data "codigo:codigo" --add-data "codigo/icono.png:." \
            --paths codigo --hidden-import app --hidden-import motor --collect-data certifi $EXTRA \
            lanzador/lanzador.py
          tar -czf vigilante-mec-linux-x86_64.tar.gz -C dist vigilante-mec
          # Instalador con ventana (genérico: los datos de cada persona van en config.vmec al lado).
          pyinstaller --noconfirm --onefile --windowed --name instalar-vigilante-mec --collect-data certifi \
            lanzador/instalador_linux.py
          cp dist/instalar-vigilante-mec instalar-vigilante-mec-linux-x86_64

      - name: Probar en un Linux limpio (bajar Chromium y abrirlo)
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/datos
        run: |
          dist/vigilante-mec/vigilante-mec --instalar-navegador
          sudo -E dist/vigilante-mec/vigilante-mec --instalar-dependencias
          xvfb-run -a dist/vigilante-mec/vigilante-mec --probar-navegador | tee prueba.txt
          grep -q NAVEGADOR_OK prueba.txt

      - name: Probar HTTPS en otras distros (antes de publicar)
        run: |
          probar() {  # $1 = imagen, $2 = comprobación previa, $3 = de dónde deben salir los certificados
            for binario in dist/vigilante-mec/vigilante-mec dist/instalar-vigilante-mec; do
              echo "== $1: $binario"
              docker run --rm -v "$PWD/dist:/w/dist:ro" -w /w "$1" sh -c "$2 && $binario --probar-conexion" | tee salida.txt
              grep -q "CONEXION_OK .*$3" salida.txt
            done
          }
          # Fedora: sin /usr/lib/ssl, donde el instalador antiguo fallaba (usa los del sistema).
          probar fedora:latest 'test ! -e /usr/lib/ssl' /etc/
          # Debian mínimo: sin ningún certificado en el sistema (usa los que trae la app).
          probar debian:stable-slim 'test ! -e /etc/ssl/certs/ca-certificates.crt' certifi/cacert.pem

      - name: Probar el paquete todo en uno (Fedora sin internet, antes de publicar)
        run: |
          mkdir -p /tmp/todo
          cp instalar-vigilante-mec-linux-x86_64 "/tmp/todo/Instalar Vigilante MEC"
          cp vigilante-mec-linux-x86_64.tar.gz /tmp/todo/
          echo '{"telegram_token": "", "chats_avisos": [], "chat_dueno": "", "rol": "respaldo"}' | base64 -w0 > /tmp/todo/config.vmec
          # Sin red ni Chrome el paso del navegador no puede pasar: se comprueba que la app quedó instalada.
          docker run --rm --network none -v /tmp/todo:/p:ro fedora:latest sh -c '
            D=/root/.local/share/vigilante-mec
            timeout 400 "/p/Instalar Vigilante MEC" --sin-ventana --acepto > /tmp/salida.txt 2>&1
            cat /tmp/salida.txt
            ! grep -q "Bajando la app" /tmp/salida.txt &&
              grep -q "Comprobando el navegador" /tmp/salida.txt &&
              test -x "$D/app/vigilante-mec" &&
              { test -f "$D/config.json" || test -f "$D/config_instalador.json"; } &&
              test -f /root/.local/share/applications/vigilante-mec.desktop &&
              echo PAQUETE_OK' | tee todo.txt
          grep -q PAQUETE_OK todo.txt

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view lanzador-v1 >/dev/null 2>&1 || \
            gh release create lanzador-v1 --title "Lanzador Linux v1" --notes "App Vigilante MEC para Linux (x86_64)."
          gh release upload lanzador-v1 vigilante-mec-linux-x86_64.tar.gz instalar-vigilante-mec-linux-x86_64 --clobber

      - name: Probar el instalador con ventana (en modo consola, con una config falsa)
        run: |
          rm -rf "$HOME/.local/share/vigilante-mec" "$HOME/.local/share/applications/vigilante-mec.desktop"
          mkdir -p /tmp/jose
          cp instalar-vigilante-mec-linux-x86_64 "/tmp/jose/Instalar Vigilante MEC"
          echo '{"telegram_token": "", "chats_avisos": [], "chat_dueno": "", "rol": "respaldo"}' | base64 -w0 > /tmp/jose/config.vmec
          xvfb-run -a "/tmp/jose/Instalar Vigilante MEC" --sin-ventana --acepto | tee instalador2.txt
          grep -q INSTALADOR_OK instalador2.txt
          test -x "$HOME/.local/share/vigilante-mec/app/vigilante-mec"
          test -f "$HOME/.local/share/applications/vigilante-mec.desktop"

      - name: Probar el instalador de Linux completo (con una config falsa)
        run: |
          echo '{"telegram_token": "", "chats_avisos": [], "chat_dueno": "", "rol": "respaldo", "nombre": "Prueba"}' > /tmp/config_prueba.json
          python herramientas/crear_instalador_jose.py /tmp/config_prueba.json /tmp/instalar_prueba.sh
          printf 'SI\nn\n' | xvfb-run -a bash /tmp/instalar_prueba.sh
          sleep 5
          test -x "$HOME/.local/share/vigilante-mec/app/vigilante-mec"
          test -f "$HOME/.local/share/applications/vigilante-mec.desktop"
          test -f "$HOME/.local/share/vigilante-mec/config.json" || test -f "$HOME/.local/share/vigilante-mec/config_instalador.json"
          echo "INSTALADOR_OK"
